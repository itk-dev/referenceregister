doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
    # MySQL/MariaDB DDL statements cause implicit commits, so migrations cannot
    # actually run in a transaction (https://github.com/doctrine/migrations/issues/1169).
    transactional: false
