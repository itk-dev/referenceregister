security:
    role_hierarchy:
        !php/enum App\Entity\Role::Administrator->value:
            - !php/enum App\Entity\Role::Manager->value
            - !php/enum App\Entity\Role::SettingEditor->value
        !php/enum App\Entity\Role::Manager->value:
            - !php/enum App\Entity\Role::DepartmentEditor->value

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\PasswordHasher\Hasher\PasswordHasherAwareInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

            logout:
                path: /logout
            custom_authenticators:
                - App\Security\OidcAuthenticator
                - ItkDev\OpenIdConnectBundle\Security\CliLoginTokenAuthenticator

            # https://symfony.com/doc/current/security/login_link.html
            login_link:
                check_route: app_login_link_check
                check_post_only: true
                signature_properties: [id, email]
                lifetime: '%env(int:LOGIN_LINK_LIFETIME)%'
                max_uses: 1
                # Failures redirected to login link request form with an error message.
                failure_path: app_login_link_request

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/openidconnect/login(/.+)?$, roles: PUBLIC_ACCESS }
        - { path: ^/login/link, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: !php/enum App\Entity\Role::Manager->value }
        - { path: ^/, roles: !php/enum App\Entity\Role::User->value }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
