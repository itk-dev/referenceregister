name: Site

env:
    COMPOSE_USER: runner

on:
    pull_request:
        paths: &paths
            - "**/*.php"
            - "composer.json"
            - "composer.lock"
            - "docker-compose.yml"
    push:
        branches:
            - main
            - develop
        paths: *paths

jobs:
    install-site-prod:
        name: Install site (prod)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Create docker network
              run: |
                  docker network create frontend

            - run: |
                  cat <<'EOF' > .env.local
                  APP_ENV=prod

                  ERROR_MAILER_FROM_EMAIL=error@example.com
                  ERROR_MAILER_TO_EMAIL=error@example.com
                  APP_SECRET=this-is-not-a-good-app-secret
                  EOF

            - run: |
                  docker compose pull
                  docker compose up --detach --remove-orphans --wait
                  docker compose exec phpfpm composer install --no-dev
                  docker compose exec phpfpm php bin/console doctrine:migrations:migrate --no-interaction
                  docker compose exec phpfpm php bin/console asset-map:compile

            - run: curl "http://$(docker compose port nginx 8080)"

    install-site-dev:
        name: Install site (dev)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Create docker network
              run: |
                  docker network create frontend

            - run: |
                  docker compose pull
                  docker compose up --detach --remove-orphans --wait
                  docker compose exec phpfpm composer install
                  docker compose exec phpfpm php bin/console doctrine:migrations:migrate --no-interaction

            - run: curl "http://$(docker compose port nginx 8080)"
